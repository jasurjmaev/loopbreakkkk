<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LOOPBREAK</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0e1a;--c:#141a2e;--l:rgba(216,182,106,.2);--g:#d8b66a;--t:#ebe7da;--m:#8b92a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(120% 70% at 50% 0,#1a2140,var(--bg));color:var(--t);font:15px/1.5 system-ui,sans-serif;min-height:100vh}
#app{padding:16px 14px 96px;max-width:560px;margin:auto}
h1{margin:6px 0 0;letter-spacing:.2em;font-size:24px;color:var(--g)}h3{margin:0 0 8px;color:var(--g);font-size:14px;letter-spacing:.05em;text-transform:uppercase}
.m{color:var(--m);font-size:13px}.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:14px;margin:10px 0}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px}.dim{opacity:.45}
.b{background:linear-gradient(135deg,#d8b66a,#a98a46);color:#14110a;border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:14px;width:auto;cursor:pointer}
.card .b{margin-top:8px}.ch .b{margin:0}.b[disabled]{opacity:.3;filter:grayscale(1);pointer-events:none}
.g{background:none;border:1px solid var(--l);color:var(--t);border-radius:12px;padding:9px 14px;cursor:pointer;font-size:14px}
input{width:100%;background:#0d1224;border:1px solid var(--l);color:var(--t);border-radius:12px;padding:12px;font-size:16px;margin-top:8px}
.cl{white-space:pre-wrap;margin:6px 0;padding:8px 10px;background:#0d1224;border-left:3px solid var(--g);border-radius:8px}
.bar{height:8px;background:#0d1224;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8a6d2f,var(--g))}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}.sz{min-width:44px}.sz.on{background:var(--g);color:#14110a;font-weight:700}
.code{font-size:30px;letter-spacing:.3em;color:var(--g);text-align:center;font-weight:700}
.mem{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--l)}
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(10,14,26,.95);border-top:1px solid var(--l);padding:8px 8px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}
#nav button{flex:1;background:none;border:0;color:var(--m);font-size:12px;padding:6px}#nav button.on{color:var(--g)}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-80px);background:#1d2540;border:1px solid var(--g);padding:10px 16px;border-radius:12px;transition:.3s;z-index:9;max-width:90%;text-align:center}#toast.on{transform:translate(-50%,0)}
.cn{background:#2a2412;border:1px solid var(--g);border-radius:20px;padding:3px 10px;font-weight:700;color:var(--g);white-space:nowrap}
.gold{color:#f5d77a;text-shadow:0 0 8px #d8b66a}.neon{color:#7df;text-shadow:0 0 8px #3cf}.frm{box-shadow:0 0 0 2px var(--g),0 0 16px #7df}
#nav button{font-size:10px;padding:6px 2px}
</style></head><body><div id="app"></div>
<nav id="nav"><button data-a="tab" data-t="home">🧩<br>Boblar</button><button data-a="tab" data-t="team">👥<br>Jamoa</button><button data-a="tab" data-t="fr">👥<br>Do'stlar</button><button data-a="tab" data-t="lab">🧪<br>LOOP LAB</button><button data-a="tab" data-t="me">👤<br>Profil</button><button id="nadm" data-a="tab" data-t="adm" style="display:none">🛠️<br>Admin</button></nav><div id="toast"></div>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();try{tg.setHeaderColor('#0a0e1a');tg.setBackgroundColor('#0a0e1a')}catch{}
let fl=null,fc=null,fq=null,tmo=false,hof=null,rpt=null,as_='dash',ad=null,au=null,ps='',lab=null,qz=null,qi=null,qEnd=0,qres=null,me,tab='home',P=null,R=null,room=null,sz=4,snd=true,ac;const $=q=>document.querySelector(q),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,b={}){const r=await fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json','X-Init':tg.initData},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)throw new Error(j.e||'Xato');return j}
const tone=(f,d=.15)=>{if(!snd)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.025;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(1e-4,ac.currentTime+d);o.stop(ac.currentTime+d)}catch{}};
function toast(t){const e=$('#toast');e.textContent=t;e.className='on';setTimeout(()=>e.className='',2600)}
const run=async f=>{try{await f()}catch(e){toast(e.message);tone(180,.25)}};
const homeV=()=>`<h1>LOOPBREAK</h1><p class="m">Jamoaviy detektiv-sarguzasht · 12 bob</p>${goalV()}${me.solo?'<button class="b" data-a="resume">▶ Davom etish</button>':''}`+me.ch.map(c=>{const dn=me.done.includes(c.n),lk=!c.open;return`<div class="card ch ${lk?'dim':''}"><div><b>${c.n}. ${esc(c.t)}</b><div class="m">${dn?'✓ Yakunlangan':lk?'🔒 Oldingi bobni yakunlang':c.lock?'💎 Premium':'Ochiq'}</div></div>${lk?'':`<button class="b" data-a="solo" data-n="${c.n}">Yakka</button>`}</div>`}).join('')+`<p class="m">Do'stlar bilan o'ynash uchun «Jamoa» bo'limiga o'ting.</p>`;
function teamV(){if(!room)return`<h1>Jamoa</h1>${tinvV()}<div class="card"><h3>Yangi jamoa</h3><input id="rn" maxlength="24" placeholder="Jamoa nomi"><p class="m">Necha kishilik xona?</p><div class="row">${[2,3,4,5,6].map(n=>`<button class="g sz ${n==sz?'on':''}" data-a="sz" data-s="${n}">${n}</button>`).join('')}</div><button class="b" data-a="mk">Jamoa yaratish</button></div><div class="card"><h3>Kod bilan qo'shilish</h3><input id="rc" maxlength="5" placeholder="Xona kodi" style="text-transform:uppercase"><button class="b" data-a="join">Qo'shilish</button></div>`;
 const mine=room.owner===me.id,full=room.mem.length>=room.size,all=full&&room.mem.every(m=>m.ready),my=room.mem.find(m=>m.id===me.id);
 return`<h1>${esc(room.name)}</h1><div class="card"><div class="m" style="text-align:center">Xona kodi</div><div class="code">${room.code}</div><div class="row" style="justify-content:center"><button class="g" data-a="share">📨 Kodni yuborish</button></div></div><div class="card"><h3>O'yinchilar ${room.mem.length}/${room.size}</h3>${room.mem.map(m=>`<div class="mem"><span>${m.id===room.owner?'👑 ':''}${esc(m.name)}</span><span>${m.ready?'✅ Tayyor':'⏳ Kutmoqda'}</span></div>`).join('')}</div><button class="b" style="width:100%;margin-bottom:8px" data-a="ready">${my&&my.ready?'Tayyor emasman':'✋ Men tayyorman'}</button>${mine?`<button class="b" style="width:100%" data-a="start" ${all?'':'disabled'}>🚀 O'yinni boshlash</button><p class="m">${full?(all?'Hamma tayyor!':'Hamma «Men tayyorman» tugmasini bosishi kerak'):`Yana ${room.size-room.mem.length} kishi kerak`}</p>`:`<p class="m">${all?'Xona egasi o\'yinni boshlaydi…':'Tayyor bo\'ling va xona egasini kuting'}</p>`}${inviteV()}<button class="g" data-a="leave">Chiqish</button>`}
const ENDS={good:['🌅 Yaxshi yakun',"Laboratoriyadan chiqdingiz. Lekin hamma dalil topilmadi, sirning bir qismi hamon yopiq."],secret:['🕶 Yashirin yakun',"Siz yashirgan dalillar haqiqatning boshqa yuzini ochdi. Hikoya tugamadi."],true:['🌀 HAQIQIY YAKUN',"Barcha dalillar, ittifoqchilar va qarorlar birlashdi. Siz LOOPBREAK sirini to'liq ochdingiz!"]};
const LV=['Yangi','Izquvar','Sirlar izquvari','Detektiv','Ustoz','Afsona'],lvl=()=>Math.floor(me.ok/10)+1,lvn=()=>LV[Math.min(5,Math.floor(lvl()/3))];
const bk='<button class="g" data-a="ps" data-p="">← Orqaga</button>',ask=m=>new Promise(r=>{try{tg.showConfirm(m,r)}catch{r(confirm(m))}});
function meV(){const m=me,nc=m.eq.nick||'',acc=m.ok+m.bad?Math.round(m.ok*100/(m.ok+m.bad)):0;
 if(ps==='coins')return bk+`<h1>🪙 ${m.coins}</h1><p class="m">LoopCoin balansi va tarixi</p>`+(m.hist.map(x=>`<div class="mem"><span>${esc(x.w)}<br><span class="m">${new Date(x.t).toLocaleString()}</span></span><b style="color:${x.n>0?'#8f8':'#f88'}">${x.n>0?'+':''}${x.n}</b></div>`).join('')||'<p class="m">Hali tarix yo\'q</p>');
 if(ps==='shop')return bk+`<h1>🛍️ Do'kon</h1><p class="m">Balans: 🪙 ${m.coins}</p>`+m.items.map(it=>{const has=it.k!=='cons'&&m.own.includes(it.id),on=it.v&&m.eq[it.k==='emo'?'emoji':it.k]===it.v;return`<div class="card ch"><div><b>${esc(it.n)}</b><div class="m">${esc(it.d||'')}${it.k==='cons'?` (sizda: ${m.inv[it.id]||0})`:''}</div></div>${has?(it.v?`<button class="g" data-a="equip" data-id="${it.id}">${on?'Yechish':'Kiyish'}</button>`:'<span class="m">✓ Sizda</span>'):`<button class="b" data-a="buy" data-id="${it.id}" ${m.coins<it.p?'style="opacity:.5"':''}>${it.p} 🪙</button>`}</div>`}).join('');
 if(ps==='info')return bk+`<h1>O'yinchi ma'lumotlari</h1><div class="card"><h3>Nik</h3>Telegram: ${esc(m.tg)}<br>O'yin niki: <b class="${nc}">${esc(m.nick||'—')}</b><input id="nk" maxlength="16" placeholder="Yangi nik (lotin harf, raqam, _)" value="${esc(m.nick)}"><button class="b" data-a="nick">Saqlash</button></div><div class="card"><h3>Bezaklar</h3>Chat belgisi: ${m.eq.emoji||'—'} ${m.own.includes('crown')?'👑':''}${m.own.includes('badge')?'🏅':''}<br>Laqab: ${esc(m.eq.title||'—')}<br>Ramka: ${m.eq.frame?'✨ neon':'—'}<p class="m">Do'kondan olgan bezaklaringizni «Kiyish» orqali tanlang.</p></div>`;
 if(ps==='ach')return bk+`<h1>🏆 Yutuqlar</h1>`+m.acs.map(a=>`<div class="card ch ${a.done?'':'dim'}"><div><b>${esc(a.t)}</b><div class="m">${esc(a.d)}</div></div><b>${a.done?'✓':'+'+a.c+' 🪙'}</b></div>`).join('');
 if(ps==='inv')return bk+`<h1>🎒 Inventar</h1><p class="m">Buyumlar faqat mos jumboqda ishlaydi va javobni to'liq ochmaydi.</p>`+[...m.idefs.map(d=>[d.n,d.d,m.inv[d.id]||0]),['💡 Ishora','Har qanday jumboqda bepul maslahat',m.inv.hint||0],['🛡️ Himoya','Bitta xato jazosini bekor qiladi',m.inv.shield||0]].map(x=>`<div class="card ch"><div><b>${x[0]}</b><div class="m">${esc(x[1])}</div></div><b>×${x[2]}</b></div>`).join('')+`<p class="m">Buyumlar olish: xatosiz bob (🧩), yordam tanlovi (🔦), haqiqat tanlovi (🗝️), tezkor sinovda 8 ta ketma-ket javob (🗝️) yoki do'kon.</p>`;
 if(ps==='base')return bk+`<h1>🏛️ Shaxsiy baza</h1><div class="card"><h3>Ochilgan xonalar (${m.done.length}/12)</h3>${m.ch.map(c=>`<span class="cl" style="display:inline-block;margin:3px;opacity:${m.done.includes(c.n)?1:.35}">${m.done.includes(c.n)?'🚪':'🔒'} ${c.n}. ${esc(c.t)}</span>`).join('')}</div><div class="card"><h3>Dalillar (${Object.keys(m.ev).length}/7)</h3>${Object.entries(m.ev).map(([k,v])=>`<p class="cl">${k}-bob: №${v.n} · «${esc(v.w)}»</p>`).join('')||'<span class="m">Hali yo\'q</span>'}</div><div class="card"><h3>📜 Kolleksiya (${m.col.length})</h3>${m.col.map(c=>`<p class="cl">${esc(c)}</p>`).join('')||'<span class="m">Boblarni tugatib hujjatlar yig\'ing</span>'}</div><div class="card"><h3>Unvon</h3>${m.title?'🎖️ '+esc(m.title):"Hali unvon yo'q: yutuqlarni oching"}</div>`;
 if(ps==='stat')return bk+`<h1>📊 Statistika</h1><div class="card">O'yinlar: <b>${m.games}</b><br>To'g'ri javoblar: <b>${m.ok}</b> · Xato: <b>${m.bad}</b><br>Aniqlik: <b>${acc}%</b><br>Tugatilgan boblar: <b>${m.cnt}</b><br>O'ynalgan kunlar: <b>${m.days}</b><br>Yakunlar: ${m.end.map(e=>ENDS[e][0]).join(', ')||'—'}</div>`;
 const ev=Object.entries(m.ev);
 return`<h1 class="${nc}">${esc(m.name)} ${m.own.includes('crown')?'👑':''}${m.own.includes('badge')?'🏅':''}</h1><div class="card ${m.eq.frame||''}"><div class="m">Daraja ${lvl()} · ${lvn()}${m.title?" · 🎖️ "+esc(m.title):""}</div><div style="display:flex;justify-content:space-around;text-align:center;margin-top:8px"><div><b style="font-size:20px">${m.coins}</b><div class="m">Tangalar</div></div><div><b style="font-size:20px">${m.games}</b><div class="m">O'yinlar</div></div><div><b style="font-size:20px">${acc}%</b><div class="m">Aniqlik</div></div></div></div>`+[['coins','🪙 Mening tangalarim','Balans va tarix'],['shop',"🛍️ Do'konim",'Buyumlar va bezaklar'],['info',"👤 O'yinchi ma'lumotlari",'Nik va bezaklar'],['ach','🏆 Yutuqlarim','Mukofotlar'],['inv','🎒 Inventar','Fonar, kalit, shifr vositasi'],['base','🏛️ Shaxsiy baza','Dalillar, xonalar, kolleksiya'],['stat','📊 Statistika','Aniqlik va rekordlar']].map(x=>`<div class="card ch" data-a="ps" data-p="${x[0]}" style="cursor:pointer"><div><b>${x[1]}</b><div class="m">${x[2]}</div></div>›</div>`).join('')+`<div class="card"><h3>Obuna</h3>${m.prem>Date.now()?`💎 Premium — ${new Date(m.prem).toLocaleDateString()} gacha`:`Premium yo'q (11–12-boblar)<br><button class="b" data-a="prem">💎 Premium olish (250 ⭐)</button>`}</div><div class="card"><h3>Dalillar (${ev.length}/7)</h3>${ev.map(([k,v])=>`<p class="cl">${k}-bob: №${v.n} · «${v.w}»</p>`).join('')||'<p class="m">Hali dalil yo\'q</p>'}<button class="g" data-a="snd">Ovoz: ${snd?'yoqilgan':"o'chirilgan"}</button></div>`}
const frV=()=>{if(!fl)return'<div class="card">Yuklanmoqda…</div>';
 if(fc)return`<div class="top"><button class="g" data-a="fback">←</button><b>${esc(fc.n)}</b><button class="g" data-a="fblk" data-id="${fc.id}">🚫</button></div><div class="card" id="fcb" style="max-height:55vh;overflow:auto">${fc.msgs.map(m=>`<div style="text-align:${m.me?'right':'left'};margin:6px 0"><span class="cl" style="display:inline-block;max-width:85%;text-align:left">${esc(m.t)}</span></div>`).join('')||'<span class="m">Hali xabar yo\'q. Birinchi bo\'lib yozing!</span>'}</div><input id="fm" maxlength="500" autocomplete="off" placeholder="Xabar yozing..."><button class="b" data-a="fsend">Yuborish</button>`;
 const inv=fl.ti.map(t=>`<div class="card ch"><div>🎮 <b>${esc(t.from)}</b> sizni jamoaga chaqirdi<div class="m">Kod: ${t.code}</div></div><button class="b" data-a="fjoin" data-c="${t.code}">Qo'shilish</button></div>`).join('');
 const inc=fl.inc.map(x=>`<div class="card ch"><div><b>${esc(x.n)}</b><div class="m">Do'stlik so'rovi yubordi</div></div><div class="row"><button class="b" data-a="facc" data-id="${x.id}">✓</button><button class="g" data-a="frej" data-id="${x.id}">✕</button></div></div>`).join('');
 const out=fl.out.map(x=>`<div class="mem"><span>⏳ ${esc(x.n)}</span><button class="g" data-a="frej" data-id="${x.id}">Bekor qilish</button></div>`).join('');
 const L=fl.fr.map(x=>`<div class="card ch"><div><b>${x.on?'🟢':'⚪'} ${esc(x.n)}</b> ${x.un?`<span class="cn">${x.un}</span>`:''}<div class="m">Daraja ${x.lvl} ${esc(x.title||'')}</div></div><div class="row"><button class="b" data-a="fchat" data-id="${x.id}">💬</button>${room&&!room.started?`<button class="g" data-a="finv" data-id="${x.id}">🎮</button>`:''}<button class="g" data-a="frm" data-id="${x.id}">✕</button></div></div>`).join('');
 return`<h1>👥 Do'stlar</h1>${inv}${inc}<div class="card"><input id="fq" placeholder="Nik yoki ID bo'yicha qidirish"><button class="b" data-a="ffind">Qidirish</button>${(fq||[]).map(x=>`<div class="mem"><span>${esc(x.n)}</span>${x.st==='f'?"✓ Do'stlar":x.st==='o'?'⏳':`<button class="g" data-a="freq" data-id="${x.id}">+ Do'st</button>`}</div>`).join('')}</div><h3>Mening do'stlarim (${fl.fr.length})</h3>${L||'<p class="m">Hali do\'st yo\'q. Jamoada o\'ynab, sherigingizni qo\'shing!</p>'}${out?`<h3>Yuborilgan so'rovlar</h3>${out}`:''}<div class="card"><button class="g" data-a="fhide">${fl.hide?'Onlayn holatim yashirin':"Onlayn holatim ko'rinadi"} (o'zgartirish)</button></div>`};
const tinvV=()=>fl&&fl.ti.length?fl.ti.map(t=>`<div class="card ch"><div>🎮 <b>${esc(t.from)}</b> sizni jamoaga chaqirdi<div class="m">Kod: ${t.code}</div></div><button class="b" data-a="fjoin" data-c="${t.code}">Qo'shilish</button></div>`).join(''):'';
const inviteV=()=>fl&&fl.fr.length&&room&&!room.started?`<div class="card"><h3>Do'stlarni chaqirish</h3>${fl.fr.map(x=>`<div class="mem"><span>${x.on?'🟢':'⚪'} ${esc(x.n)}</span><button class="g" data-a="finv" data-id="${x.id}">🎮 Chaqirish</button></div>`).join('')}</div>`:'';
const tmV=p=>p.n>1&&p.mem?`<div class="card"><div class="ch" data-a="tmt" style="cursor:pointer"><b>👥 Jamoam (${p.mem.length})</b><span>${tmo?'▲':'▼'}</span></div>${tmo?p.mem.map(x=>{const st=(me.fr||{})[x.id]||'';return`<div class="mem"><span>${x.on?'🟢':'⚪'} ${esc(x.n)}${x.id===me.id?' (siz)':''}<div class="m">${esc(x.rl||'')}</div></span>${x.id===me.id?'':st==='f'?'<span class="m">✓ Do\'stlar</span>':st==='o'?'<span class="m">⏳ Yuborildi</span>':st==='i'?`<button class="b" data-a="facc2" data-id="${x.id}">Qabul qilish</button>`:st==='b'?'':`<button class="g" data-a="freq2" data-id="${x.id}">+ Do'st</button>`}</div>`}).join(''):''}</div>`:'';

 if(a==='share'){const u='https://t.me/'+(window.BOT||'loopbreakgamee_bot');return tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(u)+'&text='+encodeURIComponent("LOOPBREAK jamoasiga qo'shiling! Xona kodi: "+room.code))}
 if(a==='prem')return tg.openTelegramLink('https://t.me/loopbreakgamee_bot?start=prem');
 if(a==='buy'){me=await api('buy',{id:d.id});toast('✅ Xarid qilindi');tone(660);return render()}

 if(a==='nick'){me=await api('nick',{n:$('#nk').value});toast('✅ Nik saqlandi');return render()}
 if(a==='dly'){const r=await api('dailyans',{a:$('#dy').value});lab=await api('daily');me=await api('me');toast(r.r==='ok'?`✅ To'g'ri! +${r.c} 🪙`:"❌ Noto'g'ri");return render()}
 if(a==='as'){as_=d.s;if(me.admin)ad=await api('a_dash');return render()}
 if(a==='ard'){ad=await api('a_dash');return render()}
 if(a==='afind'){au=await api('a_find',{q:$('#fq').value});return render()}
 if(a==='ucoin'){await api('a_uact',{id:+d.id,act:'coins',n:$('#cn'+d.id).value,why:$('#cw'+d.id).value});toast('✅ Bajarildi, jurnalga yozildi');au=await api('a_find',{q:String(d.id)});return render()}
 if(a==='uban'){if(!await ask(d.b==='ban'?"Foydalanuvchini cheklaysizmi?":"Blokdan chiqarasizmi?"))return;await api('a_uact',{id:+d.id,act:d.b});au=await api('a_find',{q:String(d.id)});return render()}
 if(a==='bct'){await api('a_bc',{text:$('#bt').value,test:true});return toast('🧪 Test xabar sizga yuborildi')}
 if(a==='bc'){const t=$('#bt').value;if(!t.trim())throw new Error("Matn bo'sh");if(!await ask("Xabar HAMMA o'yinchilarga yuboriladi. Testni ko'rdingizmi? Davom etamizmi?"))return;await api('a_bc',{text:t});ad=await api('a_dash');return render()}
 if(a==='cfg'){ad=await api('a_cfg',{k:d.k,v:$('#cf_'+d.k).value});toast('✅ Saqlandi');return render()}

 if(a==='bk'){const r=await api('a_backup');return toast(r.ok?'💾 Zaxira Telegramga yuborildi':"Yuborilmadi (ADMIN_ID va token tekshiring)")}

 if(a==='freq'){const r=await api('f_req',{id:+d.id});toast(r.st==='f'?"✓ Do'st bo'ldingiz":"⏳ So'rov yuborildi");fq=null;fl=await api('f_list');return render()}

 if(a==='qa'){const i=$('#qa'),v=i?i.value:'';if(i)i.value='';const r=await api('qans',{a:v});if(r.end){qres=r;qz=r;qi=await api('qinfo');me=await api('me')}else{qz=r;qEnd=Date.now()+r.left}render();setTimeout(()=>$('#qa')&&$('#qa').focus(),30);return}

 if(a==='snd'){snd=!snd;return render()}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;tone(560,.08);run(()=>act(t.dataset.a,t.dataset))});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&['ans','cm','qa','dy','fm'].includes(e.target.id))run(()=>act({cm:'chat',qa:'qa',dy:'dly',ans:'send',fm:'fsend'}[e.target.id],{}))});
async function tick(){try{if(!P&&tab==='fr'&&fl){if(fc){const r=await api('f_dm',{id:fc.id});if(r.msgs.length!==fc.msgs.length){fc.msgs=r.msgs;render();const bb=$('#fcb');if(bb)bb.scrollTop=bb.scrollHeight}}else{const l=await api('f_list');if(JSON.stringify(l)!==JSON.stringify(fl)){fl=l;render()}}return}
 if(P&&R){const s=await api('state',{room:R});if(s.v!==P.v||s.k!==P.k){P=s;render()}}
 else if(!P&&room&&tab==='team'){const r=await api('room',{code:room.code});if(r.started){R=r.code;room=r;P=await api('state',{room:R});return render()}if(JSON.stringify(r)!==JSON.stringify(room)){room=r;render()}}
 }catch(e){if(/topilmadi/.test(e.message)){room=null;R=null;if(P&&P.k!=='puz')P=null;render()}}}
function qclock(){if(!(qz&&!qz.end&&tab==='lab'))return;const t=$('#qt'),l=qEnd-Date.now();if(t)t.textContent=Math.max(0,Math.ceil(l/1000))+'s';if(l<-400&&!qz.fin){qz.fin=1;run(()=>act('qa',{}))}}
function clock(){const e=$('#tm');if(e&&P&&P.dl){const s=Math.max(0,Math.floor((P.dl-Date.now())/1000));e.textContent=s?`⏱ ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`:'⏳ vaqt tugadi'}}
run(async()=>{try{await reload();if(me.room)room=await api('room',{code:me.room}).catch(()=>null);render();setInterval(tick,2500);setInterval(clock,1000);setInterval(qclock,500)}catch(e){app.innerHTML=`<div class="card"><h3>Xato</h3>${esc(e.message)}</div>`}});
</script></body></html>
