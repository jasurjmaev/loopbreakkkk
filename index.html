 if(a==='crans'){const r=await api('cr_ans',{id:+d.id,a:$('#cra'+d.id).value});if(r.ok){toast(`✅ To'g'ri!${r.c?` +${r.c} 🪙`:''}`);me=await api('me')}else toast("❌ Noto'g'ri");crl=await api('cr_list');return render()}
 if(a==='crdel'){await api('cr_del',{id:+d.id});crl=await api('cr_list');return render()}
 if(a==='crrep'){await api('d_new',{txt:`Jumboq #${d.id} haqida shikoyat`});return toast('🚩 Shikoyat yuborildi')}
 if(a==='acdel'){ad=await api('a_cdel',{id:+d.id});toast("✅ O'chirildi");return render()}
 if(a==='gofr'){tab='fr';ag='';ags=null;ps='';fl=await api('f_list');dl=await api('f_dlist');return render()}
 if(a==='argo'){ag=d.g;artop=await api('ar_top',{g:d.g});
  if(ag==='cr'){await api('ar_cr_start');ags={h:[],done:0}}
  else if(ag==='sm'){const r=await api('ar_sm_start');ags={lv:1,seq:r.seq,phase:'show',inp:[],done:0};setTimeout(()=>{if(ags&&ags.phase==='show'&&ag==='sm'){ags.phase='in';render()}},r.show)}
  else if(ag==='rx')ags={st:'idle',times:[],done:0,msg:''}
  else{const r=await api('ar_gr_start');ags={c:r.c,q:r.q,done:0}}
  return render()}
 if(a==='arback'){ag='';ags=null;ari=await api('ar_info');me=await api('me');return render()}
 if(a==='crgo'){const g=$('#crg').value.trim(),r=await api('ar_cr_guess',{g});if(r.win){ags.res=`🎉 Topdingiz! ${r.a} urinish${r.c?` · +${r.c} 🪙`:''} · Rekord: ${r.rec}`;ags.done=1;artop=await api('ar_top',{g:'cr'});me=await api('me')}else if(r.lose){ags.res=`❌ ${r.why}. Kod: ${r.secret}`;ags.done=1}else ags.h.push({g,ex:r.ex,mi:r.mi});return render()}
 if(a==='smk'){ags.inp.push(+d.i);if(ags.inp.length===ags.seq.length){const r=await api('ar_sm_check',{a:ags.inp});if(r.ok){ags={lv:r.lv,seq:r.seq,phase:'show',inp:[],done:0};setTimeout(()=>{if(ags&&ags.phase==='show'&&ag==='sm'){ags.phase='in';render()}},r.show)}else{ags.done=1;ags.res=`Daraja ${r.done}${r.c?` · +${r.c} 🪙`:''} · Rekord: ${r.rec}`;artop=await api('ar_top',{g:'sm'});me=await api('me')}}return render()}
 if(a==='rxarm'){const r=await api('ar_rx_arm');ags.st='wait';ags.msg='';ags.tm=setTimeout(()=>{if(ags&&ags.st==='wait'){ags.st='go';render()}},r.delay);return render()}
 if(a==='rxtap'){clearTimeout(ags.tm);const r=await api('ar_rx_tap');ags.st='idle';if(r.early)ags.msg="Erta bosdingiz! Qayta urining";else if(r.next){ags.times.push(r.ms);ags.msg=`${r.ms} ms`}else{ags.done=1;ags.res=`Eng yaxshi: ${r.best} ms · O'rtacha ${r.avg} ms${r.c?` · +${r.c} 🪙`:''} · Rekord ${r.rec} ms`;artop=await api('ar_top',{g:'rx'});me=await api('me')}return render()}
 if(a==='grgo'){const r=await api('ar_gr_ans',{a:$('#gra').value});if(r.ok){ags.done=1;ags.res=`✅ ${r.sec} soniya${r.c?` · +${r.c} 🪙`:''} · Rekord ${r.rec} s`;artop=await api('ar_top',{g:'gr'});me=await api('me')}else toast("❌ Noto'g'ri");return render()}
 if(a==='qs'){qres=null;qz=await api('qstart');qEnd=Date.now()+qz.left;render();setTimeout(()=>$('#qa')&&$('#qa').focus(),60);return}
 if(a==='qa'){const i=$('#qa'),v=i?i.value:'';if(i)i.value='';const r=await api('qans',{a:v});if(r.end){qres=r;qz=r;qi=await api('qinfo');me=await api('me')}else{qz=r;qEnd=Date.now()+r.left}render();setTimeout(()=>$('#qa')&&$('#qa').focus(),30);return}
 if(a==='use'){P=await api('useitem',{room:R,id:d.id});return render()}
 if(a==='snd'){snd=!snd;return render()}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;tone(560,.08);run(()=>act(t.dataset.a,t.dataset))});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&['ans','cm','qa','dy','fm','una','dva'].includes(e.target.id))run(()=>act({cm:'chat',qa:'qa',dy:'dly',ans:'send',fm:'fsend',una:'unans',dva:'dans'}[e.target.id],{}))});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
async function tick(){try{if(!P&&tab==='fr'&&fl){if(fc){const r=await api('f_dm',{id:fc.id});if(r.msgs.length!==fc.msgs.length){fc.msgs=r.msgs;render();const bb=$('#fcb');if(bb)bb.scrollTop=bb.scrollHeight}}else{const l=await api('f_list');if(JSON.stringify(l)!==JSON.stringify(fl)){fl=l;render()}}return}
 if(P&&!document.hidden){const s=await api('state',{room:R});if(s.k==='none'){P=null;render()}else if(s.v!==P.v||s.k!==P.k){P=s;render()}}
 else if(!P&&room&&tab==='team'){const r=await api('room',{code:room.code});if(r.started){R=r.code;room=r;P=await api('state',{room:R});return render()}if(JSON.stringify(r)!==JSON.stringify(room)){room=r;render()}}
 }catch(e){if(/topilmadi/.test(e.message)){room=null;R=null;if(P&&P.k!=='puz')P=null;render()}}}
function qclock(){if(!(qz&&!qz.end&&tab==='lab'))return;const t=$('#qt'),l=qEnd-Date.now();if(t)t.textContent=Math.max(0,Math.ceil(l/1000))+'s';if(l<-400&&!qz.fin){qz.fin=1;run(()=>act('qa',{}))}}
function clock(){const e=$('#tm');if(e&&P&&P.dl){const s=Math.max(0,Math.floor((P.dl-Date.now())/1000));e.textContent=s?`⏱ ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`:'⏳ vaqt tugadi'}}
run(async()=>{try{await reload();if(me.room)room=await api('room',{code:me.room}).catch(()=>null);render();setInterval(tick,2500);setInterval(clock,1000);setInterval(qclock,500);setInterval(()=>{const e=$('#lkt');if(e&&P&&P.lend){const l=Math.ceil((P.lend-Date.now())/1000);if(l>0)e.textContent=l+' s';else{P.lk=0;P.lend=0;render()}}},500);setInterval(()=>{const e=$('#svt');if(e&&P&&P.tend)e.textContent=Math.max(0,Math.ceil((P.tend-Date.now())/1000))+' s'},500)}catch(e){app.innerHTML=`<div class="card"><h3>Xato</h3>${esc(e.message)}</div>`}});
</script></body></html>
