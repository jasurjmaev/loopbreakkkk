<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LOOPBREAK</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0e1a;--c:#141a2e;--l:rgba(216,182,106,.2);--g:#d8b66a;--t:#ebe7da;--m:#8b92a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(120% 70% at 50% 0,#1a2140,var(--bg));color:var(--t);font:15px/1.5 system-ui,sans-serif;min-height:100vh}
#app{padding:16px 14px 96px;max-width:560px;margin:auto}
h1{margin:6px 0 0;letter-spacing:.2em;font-size:24px;color:var(--g)}h3{margin:0 0 8px;color:var(--g);font-size:14px;letter-spacing:.05em;text-transform:uppercase}
.m{color:var(--m);font-size:13px}.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:14px;margin:10px 0}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px}.dim{opacity:.45}
.b{background:linear-gradient(135deg,#d8b66a,#a98a46);color:#14110a;border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:14px;width:auto;cursor:pointer}
.card .b{margin-top:8px}.ch .b{margin:0}.b[disabled]{opacity:.3;filter:grayscale(1);pointer-events:none}
.g{background:none;border:1px solid var(--l);color:var(--t);border-radius:12px;padding:9px 14px;cursor:pointer;font-size:14px}
input{width:100%;background:#0d1224;border:1px solid var(--l);color:var(--t);border-radius:12px;padding:12px;font-size:16px;margin-top:8px}
.cl{margin:6px 0;padding:8px 10px;background:#0d1224;border-left:3px solid var(--g);border-radius:8px}
.bar{height:8px;background:#0d1224;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8a6d2f,var(--g))}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}.sz{min-width:44px}.sz.on{background:var(--g);color:#14110a;font-weight:700}
.code{font-size:30px;letter-spacing:.3em;color:var(--g);text-align:center;font-weight:700}
.mem{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--l)}
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(10,14,26,.95);border-top:1px solid var(--l);padding:8px 8px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}
#nav button{flex:1;background:none;border:0;color:var(--m);font-size:12px;padding:6px}#nav button.on{color:var(--g)}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-80px);background:#1d2540;border:1px solid var(--g);padding:10px 16px;border-radius:12px;transition:.3s;z-index:9;max-width:90%;text-align:center}#toast.on{transform:translate(-50%,0)}
</style></head><body><div id="app"></div>
<nav id="nav"><button data-a="tab" data-t="home">🧩<br>Boblar</button><button data-a="tab" data-t="team">👥<br>Jamoa</button><button data-a="tab" data-t="me">👤<br>Profil</button></nav><div id="toast"></div>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();try{tg.setHeaderColor('#0a0e1a');tg.setBackgroundColor('#0a0e1a')}catch{}
let me,tab='home',P=null,R=null,room=null,sz=4,snd=true,ac;const $=q=>document.querySelector(q),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,b={}){const r=await fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json','X-Init':tg.initData},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)throw new Error(j.e||'Xato');return j}
const tone=(f,d=.15)=>{if(!snd)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.025;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(1e-4,ac.currentTime+d);o.stop(ac.currentTime+d)}catch{}};
function toast(t){const e=$('#toast');e.textContent=t;e.className='on';setTimeout(()=>e.className='',2600)}
const run=async f=>{try{await f()}catch(e){toast(e.message);tone(180,.25)}};
const homeV=()=>`<h1>LOOPBREAK</h1><p class="m">Jamoaviy detektiv-sarguzasht · 8 bob</p>${me.solo?'<button class="b" data-a="resume">▶ Davom etish</button>':''}`+me.ch.map(c=>{const dn=me.done.includes(c.n),lk=!c.open;return`<div class="card ch ${lk?'dim':''}"><div><b>${c.n}. ${esc(c.t)}</b><div class="m">${dn?'✓ Yakunlangan':lk?'🔒 Oldingi bobni yakunlang':c.lock?'💎 Premium':'Ochiq'}</div></div>${lk?'':`<button class="b" data-a="solo" data-n="${c.n}">Yakka</button>`}</div>`}).join('')+`<p class="m">Do'stlar bilan o'ynash uchun «Jamoa» bo'limiga o'ting.</p>`;
function teamV(){if(!room)return`<h1>Jamoa</h1><div class="card"><h3>Yangi jamoa</h3><input id="rn" maxlength="24" placeholder="Jamoa nomi"><p class="m">Necha kishilik xona?</p><div class="row">${[2,3,4,5,6].map(n=>`<button class="g sz ${n==sz?'on':''}" data-a="sz" data-s="${n}">${n}</button>`).join('')}</div><button class="b" data-a="mk">Jamoa yaratish</button></div><div class="card"><h3>Kod bilan qo'shilish</h3><input id="rc" maxlength="5" placeholder="Xona kodi" style="text-transform:uppercase"><button class="b" data-a="join">Qo'shilish</button></div>`;
 const mine=room.owner===me.id,full=room.mem.length>=room.size,all=full&&room.mem.every(m=>m.ready),my=room.mem.find(m=>m.id===me.id);
 return`<h1>${esc(room.name)}</h1><div class="card"><div class="m" style="text-align:center">Xona kodi</div><div class="code">${room.code}</div><div class="row" style="justify-content:center"><button class="g" data-a="share">📨 Kodni yuborish</button></div></div><div class="card"><h3>O'yinchilar ${room.mem.length}/${room.size}</h3>${room.mem.map(m=>`<div class="mem"><span>${m.id===room.owner?'👑 ':''}${esc(m.name)}</span><span>${m.ready?'✅ Tayyor':'⏳ Kutmoqda'}</span></div>`).join('')}</div><button class="b" style="width:100%;margin-bottom:8px" data-a="ready">${my&&my.ready?'Tayyor emasman':'✋ Men tayyorman'}</button>${mine?`<button class="b" style="width:100%" data-a="start" ${all?'':'disabled'}>🚀 O'yinni boshlash</button><p class="m">${full?(all?'Hamma tayyor!':'Hamma «Men tayyorman» tugmasini bosishi kerak'):`Yana ${room.size-room.mem.length} kishi kerak`}</p>`:`<p class="m">${all?'Xona egasi o\'yinni boshlaydi…':'Tayyor bo\'ling va xona egasini kuting'}</p>`}<button class="g" data-a="leave">Chiqish</button>`}
const ENDS={good:['🌅 Yaxshi yakun',"Laboratoriyadan chiqdingiz. Lekin hamma dalil topilmadi, sirning bir qismi hamon yopiq."],secret:['🕶 Yashirin yakun',"Siz yashirgan dalillar haqiqatning boshqa yuzini ochdi. Hikoya tugamadi."],true:['🌀 HAQIQIY YAKUN',"Barcha dalillar, ittifoqchilar va qarorlar birlashdi. Siz LOOPBREAK sirini to'liq ochdingiz!"]};
const meV=()=>{const ev=Object.entries(me.ev);return`<h1>${esc(me.name)}</h1><div class="card"><h3>Obuna</h3>${me.prem>Date.now()?`💎 Premium — ${new Date(me.prem).toLocaleDateString()} gacha`:`Premium yo'q<br><button class="b" data-a="buy">💎 Premium olish (250 ⭐)</button>`}</div><div class="card"><h3>Yutuqlar</h3>Yakunlangan boblar: <b>${me.done.length}/8</b><br>Ochilgan yakunlar: ${me.end.map(e=>ENDS[e][0]).join(', ')||'—'}</div><div class="card"><h3>Dalillar (${ev.length}/7)</h3>${ev.map(([k,v])=>`<p class="cl">${k}-bob: №${v.n} · «${v.w}»</p>`).join('')||'<p class="m">Hali dalil yo\'q</p>'}</div><div class="card"><button class="g" data-a="snd">Ovoz: ${snd?'yoqilgan':'o\'chirilgan'}</button></div>`};
function playV(){const p=P;let h=`<div class="top">${R?'<span></span>':'<button class="g" data-a="back">←</button>'}<b>${esc(p.t||'')}</b><span id="tm" class="m"></span></div>`;const en=Math.max(0,p.en||0),evs=Object.entries(p.ev||{});
 const banner=p.msg?`<div class="card">${esc(p.msg)}</div>`:'';
 if(p.k==='puz')return h+`<div class="bar"><i style="width:${en}%"></i></div><div class="m">⚡ ${en} · Qadam ${p.step}/${p.tot}${p.role?` · Siz ${p.role}-o'yinchisiz`:''}</div>${banner}<div class="card"><i>${esc(p.story)}</i></div><div class="card"><h3>${p.n>1?"Sizdagi ma'lumot":"Ma'lumotlar"}</h3>${p.clues.map(c=>`<p class="cl">${esc(c)}</p>`).join('')||"<p class='m'>Sizda ma'lumot yo'q. Jamoadoshlaringizdan so'rang.</p>"}${p.n>1?'<p class="m">Boshqalar boshqa ma\'lumot ko\'rmoqda. Birlashtiring!</p>':''}</div><div class="card"><b>${esc(p.q)}</b><input id="ans" autocomplete="off" placeholder="Javobingiz"><button class="b" data-a="send">Yuborish</button></div>${p.hint?`<div class="card">💡 ${esc(p.hint)}</div>`:`<button class="g" data-a="hint">💡 Maslahat (${p.fh>0?'bepul':'−15 energiya'})</button>`}<div class="card"><h3>Dalillar</h3>${evs.map(([k,v])=>`<span class="cl" style="display:inline-block;margin:3px">${k}-bob №${v.n} «${esc(v.w)}»</span>`).join('')||'<span class="m">Hali yo\'q</span>'}</div>`;
 if(p.k==='choice')return h+`${banner}<div class="card"><h3>Qaror</h3>Qorong'ida yarador begona yordam so'raydi. Uning cho'ntagida esa sizga kerak bo'lgan dalil bor.</div><button class="b" style="width:100%;margin-bottom:8px" data-a="ch" data-c="a">🤝 Yordam berish (ittifoqchi, +30 energiya)</button><button class="b" style="width:100%" data-a="ch" data-c="b">🕶 Dalilni yashirish (−20 energiya)</button>`;
 if(p.k==='lock')return h+`${banner}<div class="card"><h3>💎 Premium kerak</h3>Keyingi bob faqat Premium obunachilar uchun. Premium olgach shu yerga qaytsangiz, o'yin davom etadi.</div><button class="b" data-a="buy">Premium olish (250 ⭐)</button>`;
 if(p.k==='end'){const e=ENDS[p.end]||ENDS.good;return h+`<div class="card" style="text-align:center"><h1>${e[0]}</h1><p>${e[1]}</p></div><button class="b" style="width:100%" data-a="exit">Yakunlash</button>`}
 return h+'<div class="card">Yuklanmoqda…</div>'}
function render(){const a=$('#ans'),v=a?a.value:'';$('#nav').style.display=P?'none':'flex';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));app.innerHTML=P?playV():{home:homeV,team:teamV,me:meV}[tab]();const n=$('#ans');if(n&&v)n.value=v}
const reload=async()=>{me=await api('me')};
async function act(a,d){
 if(a==='tab'){tab=d.t;return render()}
 if(a==='solo'){P=await api('solo',{ch:+d.n});R=null;return render()}
 if(a==='resume'){const s=await api('state',{});if(s.k==='none')throw new Error("Saqlangan o'yin yo'q");P=s;R=null;return render()}
 if(a==='back'){P=null;await reload();return render()}
 if(a==='send'){const v=$('#ans').value.trim();if(!v)return;const o=P.step,ch=P.ch;P=await api('answer',{room:R,a:v});tone(P.step>o||P.ch!==ch||P.k!=='puz'?740:200);render();return}
 if(a==='hint'){P=await api('hint',{room:R});return render()}
 if(a==='ch'){P=await api('choice',{room:R,c:d.c});tone(520);return render()}
 if(a==='exit'){if(R)await api('rleave',{code:R});P=null;R=null;room=null;await reload();tab='home';return render()}
 if(a==='sz'){sz=+d.s;return render()}
 if(a==='mk'){room=await api('rcreate',{name:$('#rn').value,size:sz});return render()}
 if(a==='join'){room=await api('rjoin',{code:$('#rc').value});return render()}
 if(a==='ready'){room=await api('rready',{code:room.code});return render()}
 if(a==='start'){await api('rstart',{code:room.code});R=room.code;P=await api('state',{room:R});return render()}
 if(a==='leave'){await api('rleave',{code:room.code});room=null;return render()}
 if(a==='share'){const u='https://t.me/'+(window.BOT||'loopbreakgamee_bot');return tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(u)+'&text='+encodeURIComponent("LOOPBREAK jamoasiga qo'shiling! Xona kodi: "+room.code))}
 if(a==='buy')return tg.openTelegramLink('https://t.me/loopbreakgamee_bot?start=prem');
 if(a==='snd'){snd=!snd;return render()}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;tone(560,.08);run(()=>act(t.dataset.a,t.dataset))});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ans')run(()=>act('send',{}))});
async function tick(){try{
 if(P&&R){const s=await api('state',{room:R});if(s.v!==P.v||s.k!==P.k){P=s;render()}}
 else if(!P&&room&&tab==='team'){const r=await api('room',{code:room.code});if(r.started){R=r.code;room=r;P=await api('state',{room:R});return render()}if(JSON.stringify(r)!==JSON.stringify(room)){room=r;render()}}
 }catch(e){if(/topilmadi/.test(e.message)){room=null;R=null;if(P&&P.k!=='puz')P=null;render()}}}
function clock(){const e=$('#tm');if(e&&P&&P.dl){const s=Math.max(0,Math.floor((P.dl-Date.now())/1000));e.textContent=s?`⏱ ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`:'⏳ vaqt tugadi'}}
run(async()=>{try{await reload();if(me.room)room=await api('room',{code:me.room}).catch(()=>null);render();setInterval(tick,2500);setInterval(clock,1000)}catch(e){app.innerHTML=`<div class="card"><h3>Xato</h3>${esc(e.message)}</div>`}});
</script></body></html>
